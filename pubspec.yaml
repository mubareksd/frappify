name: frappify
description: A Very Good Project created by Very Good CLI.
version: 0.0.1+1
publish_to: none

environment:
  sdk: ^3.9.2

dependencies:
  app_logger:
    path: ../packages/app_logger
  app_ui:
    path: ../packages/app_ui
  bloc: ^9.0.0
  country_flags: ^3.3.0
  device_preview: ^1.3.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.1.0
  frappe_client:
    path: ../packages/frappe_client
  hive_ce: ^2.12.0
  hive_ce_flutter: ^2.3.2
  hugeicons: ^0.0.11
  hydrated_bloc: ^10.0.0
  intl: ^0.20.2
  introduction_screen: ^3.1.17
  package_info_plus: ^8.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  persistent_storage:
    path: ../packages/persistent_storage
  provider: ^6.1.5
  responsive_framework: ^1.5.1
  responsive_grid_list: ^1.4.0
  secure_storage:
    path: ../packages/secure_storage
  shadcn_ui:
    git:
      url: https://github.com/nank1ro/flutter-shadcn-ui
  skeletonizer: ^2.1.0+1
  toastification: ^3.0.3

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.7.1
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.9.3
  melos: ^7.1.1
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

workspace:
  - packages/app_logger
  - packages/app_ui
  - packages/frappe_client
  - packages/persistent_storage
  - packages/secure_storage
  - packages/storage

melos:
  useRootAsPackage: true
  categories:
    app:
      - "."
    packages:
      - "packages/**"
  command:
    bootstrap:
      environment:
        sdk: ^3.9.2
        flutter: ^3.35.4

  scripts:
    # collect coverage information for all packages
    coverage: >
      melos exec -c 1 --fail-fast --dir-exists=test -- \
        flutter test --coverage && melos run coverage:cleanup

    # cleanup generated files from coverage
    coverage:cleanup: >
      melos exec --file-exists=coverage/lcov.info -- \
        lcov --remove coverage/lcov.info \
          '**/*.freezed.dart' \
          '**/*.g.dart' \
          '**/*.mocks.dart' \
          '**/l10n/*.dart' \
          '**/*.pb*.dart' \
          --ignore-errors unused \
          -o coverage/lcov.info

    # format all packages' files except for generated files
    format:exclude: >
      melos exec -c 1 -- \
        "find $MELOS_PACKAGE_PATH -name '*.dart' \
            ! -name '*.freezed.dart' \
            ! -name '*.g.dart' \
            ! -name '*.mocks.dart' \
            ! -path '*/l10n/*' \
            ! -name '*.pb*.dart' \
            ! -path '*/.*/*' \
            | xargs dart format --set-exit-if-changed"

    # run build_runner to generate code in all packages
    generate: >
      melos exec -c 1 --fail-fast --depends-on="build_runner" -- \
        dart run build_runner build --delete-conflicting-outputs

    # run gen-l10n to generate localizations in all packages
    gen-l10n: >
      melos exec -c 1 --fail-fast --file-exists="lib/l10n.dart" -- \
      flutter gen-l10n

    # remove unused translations in all packages, you have to have jq installed.
    clean-l10n: >
      melos exec --depends-on="translations_cleaner" -c 1 -- \
        dart run translations_cleaner clean-translations && \
        find . -name "*.arb" -exec sh -c 'jq . --indent 2 {} > temp.json && mv temp.json {}' \;

    # run integration tests in all packages
    integration_test: >
      melos exec -c 1 --fail-fast --dir-exists=integration_test -- \
        flutter test integration_test

    # runs "flutter pub <arg(s)>" in all packages
    pub: melos exec -c 1 -- flutter pub "$@"

    # run tests in all packages
    test: >
      melos exec -c 1 --fail-fast --dir-exists=test -- \
        flutter test

    # run pub upgrade in all packages
    upgrade: melos exec -c 1 flutter pub upgrade

    cleanup: >
      melos exec -c 1 --fail-fast --dir-exists=build -- \
        rm -rf build
      melos exec -c 1 --fail-fast --dir-exists=coverage -- \
        rm -rf coverage